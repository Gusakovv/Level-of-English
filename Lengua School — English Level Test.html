<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Lengua School — English Level Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#14213d;--mu:#64708a;--ac:#162545;--hi:#2f6bff;--soft:#e8eefc;--bd:#e1e7f2;--ok:#12a150;--bad:#d92d20;--sh:0 8px 30px rgba(22,37,69,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#16203a;--tx:#eef2fb;--mu:#9aa7c4;--ac:#dbe5ff;--hi:#6d95ff;--soft:#1d2b4d;--bd:#26345a;--ok:#3ddc84;--bad:#ff7b72;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#16203a;--tx:#eef2fb;--mu:#9aa7c4;--ac:#dbe5ff;--hi:#6d95ff;--soft:#1d2b4d;--bd:#26345a;--ok:#3ddc84;--bad:#ff7b72;--sh:0 8px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Montserrat,"Segoe UI",Arial,sans-serif;line-height:1.55}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:12px}
nav img{height:40px;width:auto;display:block}.wm{font-size:12px;line-height:1.25;color:var(--tx);font-weight:500}.wm b{font-weight:700;font-size:14px}
nav .sp{flex:1}.pill{background:var(--soft);color:var(--hi);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
.w{max-width:820px;margin:0 auto;padding:22px 16px 40px}
.hero{background:linear-gradient(135deg,#162545,#2a4a9a);color:#fff;border-radius:20px;padding:32px 28px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{margin:0 0 8px;font-size:30px;font-weight:800;line-height:1.2}.hero p{margin:0;opacity:.85;max-width:520px}
.ft{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.ft span{background:rgba(255,255,255,.14);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;margin-top:16px;box-shadow:var(--sh)}
h2{margin:0 0 10px;font-size:20px;font-weight:700}h3{margin:18px 0 8px;font-size:15px}
button,input{font:inherit}label{font-size:13px;font-weight:600;color:var(--mu)}
input{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);margin:6px 0 14px}input:focus{outline:none;border-color:var(--hi)}
button,a.b{display:inline-block;background:var(--hi);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;cursor:pointer;text-decoration:none;margin:4px 8px 4px 0;font-size:15px}
button.s,a.s{background:var(--soft);color:var(--hi)}button:disabled{opacity:.4;cursor:default}
.o{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);margin:8px 0;padding:13px 14px;font-weight:500}
.o i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--hi);display:grid;place-items:center;font-size:13px;font-weight:700}
.o.sel{border-color:var(--hi);background:var(--soft)}.o.sel i{background:var(--hi);color:#fff}
.bar{height:8px;background:var(--bd);border-radius:4px;margin:10px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hi),#7aa2ff);border-radius:4px;transition:width .4s}
.tag{display:inline-block;background:var(--soft);color:var(--hi);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;margin-right:6px}.mu{color:var(--mu);font-size:13px}
.q{font-size:19px;font-weight:600;margin:12px 0 14px}
.rs{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.ring{position:relative;width:140px;height:140px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}.ring .t{stroke:var(--bd)}.ring .p{stroke:var(--hi);stroke-dasharray:327;animation:dash 1.2s ease-out forwards}
@keyframes dash{from{stroke-dashoffset:327}to{stroke-dashoffset:var(--o)}}
.lv{font-size:38px;font-weight:800;color:var(--hi);line-height:1.1}
.trk{display:flex;gap:6px;margin:16px 0}.trk span{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--soft);color:var(--mu);font-size:13px;font-weight:700}.trk .on{background:var(--hi);color:#fff}
.sk{margin:12px 0}.sk div{height:10px;background:var(--bd);border-radius:5px;margin-top:4px;overflow:hidden}.sk i{display:block;height:100%;border-radius:5px}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}.bad{color:var(--bad)}.ok{color:var(--ok)}
.warn{background:var(--soft);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:500}
footer{text-align:center;color:var(--mu);font-size:12px;padding:10px}
</style></head><body>

const LV=["A2","B1","B2"],app=document.getElementById("app"),KEY="lengua_result_v1";
let db=null,uid="guest",admin=false,S={},ply=0;
const n=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(r,t)=>t?Math.round(100*r/t):0;
const prep=(l,x)=>{if(x[0]=="U")return{l,c:"U",q:x[1],acc:x[2].map(n),disp:x[2][0],id:x[1]};let o=sh(x[2].map((t,i)=>[t,i]));return{l,c:x[0],q:x[1],o:o.map(e=>e[0]),a:o.findIndex(e=>e[1]===x[3]),id:x[1],say:x[4]}};
const okq=q=>q.c=="U"?q.acc.includes(n(q.g||"")):q.g==q.a;
const given=q=>q.c=="U"?(q.g||"—"):q.o[q.g];
function show(h){app.innerHTML=h;window.scrollTo(0,0)}
function say(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function skills(c){return Object.keys(c).map(k=>{let p=pct(c[k][0],c[k][1]);return`<div class="sk"><b style="font-size:14px">${CN[k]}</b> <span class="mu">${c[k][0]}/${c[k][1]} · ${p}%</span><div><i style="width:${p}%;background:${p<50?"var(--bad)":p<75?"#f59e0b":"var(--ok)"}"></i></div></div>`}).join("")}
function home(){try{let m=location.hash.match(/^#r=(.+)$/);if(m)return showResult(JSON.parse(decodeURIComponent(escape(atob(m[1])))),false)}catch(e){}let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(saved&&!admin)return showResult(saved,true);
 show(`<div class="hero"><h1>Find out your English level</h1><p>A 50-question placement test based on CEFR levels A2–B2. You will get your exact level and see your strengths and weak spots.</p><div class="ft"><span>50 questions</span><span>about 35 minutes</span><span>Listening included</span><span>One attempt</span></div></div>
 <div class="c"><h2>Register to start</h2><label>Your first and last name</label><input id="nm" placeholder="Anna Ivanova" autocomplete="name"><p class="mu">You have <b>one attempt</b>. No dictionaries, no translators. Turn on your sound for the listening tasks.</p><button id="go">Start the test →</button>${admin?'<button class="s" id="pn">Teacher panel</button>':''}</div>`);
 document.getElementById("go").onclick=()=>{let nm=document.getElementById("nm").value.trim();if(nm.length<3)return alert("Please enter your first and last name");S={name:nm,t0:Date.now()};
 let pl=[];LV.forEach(l=>sh(D[l].filter(x=>x[0]=="G"||x[0]=="V")).slice(0,4).forEach(x=>pl.push(prep(l,x))));S.pl=sh(pl);S.used=pl.map(x=>x.id);run(S.pl,0,"p")};
 if(admin)document.getElementById("pn").onclick=panel}
function run(qs,i,ph){if(i>=qs.length)return ph=="p"?afterP():afterD();let q=qs[i],k=ph=="p"?i:12+i,sel=-1,typed=q.c=="U",plays=0,T=ph=="p"?50:12+qs.length;
 show(`<div class="c"><div class="mu"><b>Question ${k+1} of ${T}</b> · Part ${ph=="p"?1:2}</div><div class="bar"><i style="width:${100*k/T}%"></i></div><span class="tag">${CN[q.c]}</span><div class="q">${esc(q.q)}</div>
 ${q.say?`<button class="s" id="pl">▶ Play audio</button><span class="mu" id="pc">You can listen twice</span>`:""}
 ${typed?`<input id="ty" placeholder="Type your answer" autocomplete="off" autocapitalize="off">`:q.o.map((t,j)=>`<button class="o" data-k="${j}"><i>${"ABCD"[j]}</i>${esc(t)}</button>`).join("")}<br><button id="nx" disabled>Next →</button></div>`);
 if(q.say){let b=document.getElementById("pl");b.onclick=()=>{if(plays>=2)return;plays++;say(q.say);document.getElementById("pc").textContent=plays>=2?"No more plays":"1 play left";if(!window.speechSynthesis)document.getElementById("pc").textContent="Audio unavailable: "+q.say}}
 if(typed)document.getElementById("ty").oninput=e=>{sel=e.target.value;document.getElementById("nx").disabled=!sel.trim()};
 document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{sel=+b.dataset.k;document.querySelectorAll(".o").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");document.getElementById("nx").disabled=false});
 document.getElementById("nx").onclick=()=>{speechSynthesis&&speechSynthesis.cancel();q.g=sel;run(qs,i+1,ph)}}
function afterP(){let s={A2:0,B1:0,B2:0};S.pl.forEach(q=>{if(okq(q))s[q.l]++});S.ps=s;
 S.lvl=(s.B1>=3&&s.B2>=3)?"B2":(s.A2>=3&&s.B1>=2)?"B1":"A2";
 show(`<div class="c"><h2>Part 1 complete ✓</h2><p>Great work! Part 2 is a detailed test with more task types: grammar, vocabulary, reading, listening, everyday English and use of English. Take your time.</p><button id="c">Continue →</button></div>`);
 document.getElementById("c").onclick=()=>{S.dq=sh(D[S.lvl].filter(x=>!S.used.includes(x[1]))).map(x=>prep(S.lvl,x));run(S.dq,0,"d")}}
async function afterD(){let all=S.pl.concat(S.dq),cats={};all.forEach(q=>{let c=cats[q.c]=cats[q.c]||[0,0];c[1]++;if(okq(q))c[0]++});
 let dr=S.dq.filter(okq).length,p=pct(dr,S.dq.length),i=LV.indexOf(S.lvl),f;
 if(p>=85&&i<2)f={c:S.lvl,n:NM[S.lvl],up:LV[i+1]};else if(p>=55)f={c:S.lvl,n:NM[S.lvl]};else f=i>0?{c:LV[i-1],n:NM[LV[i-1]]}:{c:"A1",n:"Beginner"};
 let tot=all.filter(okq).length,res={name:S.name,uid,ts:Date.now(),mins:Math.max(1,Math.round((Date.now()-S.t0)/60000)),placement:S.lvl,ps:S.ps,deepPct:p,level:f.c+" "+f.n,code:f.c,up:f.up||"",total:tot,count:all.length,cats,
 wrong:all.filter(q=>!okq(q)).map(q=>({c:q.c,l:q.l,q:q.q,g:given(q),a:q.c=="U"?q.disp:q.o[q.a]}))};
 try{localStorage.setItem(KEY,JSON.stringify(res))}catch(e){}
 if(db){try{await db.collection("results").doc(uid).set(res)}catch(e){}}
 showResult(res,false)}
function shareText(r){return`Lengua School English Level Test\nName: ${r.name}\nLevel: ${r.level}\nScore: ${r.total}/${r.count} (${pct(r.total,r.count)}%)\nSkills: ${Object.keys(r.cats).map(k=>CN[k]+" "+r.cats[k][0]+"/"+r.cats[k][1]).join("; ")}\nMistakes (${r.wrong.length}):\n`+r.wrong.map((x,i)=>`${i+1}. [${CN[x.c]}] ${x.q.slice(0,70)} → ${x.g} (correct: ${x.a})`).join("\n")}
function showResult(r,again){let p=pct(r.total,r.count),ks=Object.keys(r.cats).sort((a,b)=>r.cats[b][0]/r.cats[b][1]-r.cats[a][0]/r.cats[a][1]),tx=encodeURIComponent(shareText(r)),codes=["A1","A2","B1","B2"];
 show(`${again?'<div class="warn">You have already completed this test. Here is your result.</div>':''}<div class="c"><div class="mu">Your result, ${esc(r.name)}</div><div class="rs"><div class="ring"><svg width="140" height="140"><circle class="t" cx="70" cy="70" r="52"/><circle class="p" cx="70" cy="70" r="52" style="--o:${327*(1-p/100)}"/></svg><b>${p}%</b></div><div><div class="lv">${r.code}</div><div style="font-size:20px;font-weight:700">${r.level.slice(r.code.length+1)}</div><div class="mu">${r.total} of ${r.count} correct · ${r.mins} min</div></div></div>
 <div class="trk">${codes.map(c=>`<span class="${c==r.code?"on":""}">${c}</span>`).join("")}</div><p>${CAN[r.code]}${r.up?" You are close to <b>"+r.up+" "+NM[r.up]+"</b>.":""}</p></div>
 <div class="c"><h2>Your skills</h2>${skills(r.cats)}<p class="warn">Strongest: <b>${CN[ks[0]]}</b> · Needs most practice: <b>${CN[ks[ks.length-1]]}</b> (${REC[ks[ks.length-1]]}).</p></div>
 <div class="c"><h2>Share your result</h2><p class="mu">Copy the link to your result and send it to your teacher.</p><button id="cp">Copy link</button><div class="mu" id="sm"></div></div>`);
 document.getElementById("cp").onclick=async()=>{let l=location.href.split("#")[0]+"#r="+btoa(unescape(encodeURIComponent(JSON.stringify(r))));try{await navigator.clipboard.writeText(l);document.getElementById("sm").textContent="Link copied!"}catch(e){document.getElementById("sm").textContent="Copy failed"}}}
function panel(){show(`<div class="c"><h2>Teacher panel</h2><button class="s" id="bk">← Back</button><div id="ls" class="mu">${db?"Loading…":"Open this page signed in to see saved results."}</div></div>`);
 document.getElementById("bk").onclick=home;if(!db)return;
 db.collection("results").orderBy("ts","desc").onSnapshot(sn=>{let rows=[];sn.forEach(d=>rows.push(d.data()));
 document.getElementById("ls").innerHTML=rows.length?rows.map(r=>{let w=Object.keys(r.cats).sort((a,b)=>r.cats[a][0]/r.cats[a][1]-r.cats[b][0]/r.cats[b][1])[0];
 return`<div class="c"><b>${esc(r.name)}</b> — <b style="color:var(--hi)">${esc(r.level)}</b> <span class="mu">${new Date(r.ts).toLocaleDateString("en-GB")} · ${r.total}/${r.count}</span>${skills(r.cats)}<p><b>Train:</b> ${CN[w]} (${REC[w]}).</p><details><summary>Mistakes (${r.wrong.length})</summary><div class="tb"><table><tr><th>Skill</th><th>Question</th><th>Answer</th><th>Correct</th></tr>${r.wrong.map(x=>`<tr><td>${CN[x.c]} ${x.l}</td><td>${esc(x.q)}</td><td class="bad">${esc(x.g)}</td><td class="ok">${esc(x.a)}</td></tr>`).join("")}</table></div></details></div>`}).join(""):"No results yet."})}
home();
(async()=>{try{let u=await claude.use("user");if(u){uid=String(await u.id());admin=u.canEdit()}db=await claude.use("db")}catch(e){}if(!S.name)home()})();
</script></body></html>
